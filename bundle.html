/* =============================================================
   GIFU — 岐阜の魂 · The Spirit of Gifu
   Design system: sharp edges, pale ground, quiet type.
   No border-radius anywhere. No shadows. Hairline rules only.

   The design system is taken unchanged from The Book of Sake
   (github.com/13studio-sudo/sake), © 2026 13studio-sudo,
   MIT License — reused here under that licence.
   ============================================================= */

:root{
  color-scheme: light;

  /* --- Ground: pale, warm, low-chroma paper ------------------ */
  --paper:      #FBFAF7;
  --paper-2:    #F5F3ED;
  --paper-3:    #EDEAE2;
  --paper-4:    #E4E0D6;

  /* --- Ink: soft near-black, never pure #000 ----------------- */
  --ink:        #201E1B;
  --ink-2:      #55504A;
  --ink-3:      #8B857C;
  --ink-4:      #ADA79E;

  /* --- Hairlines -------------------------------------------- */
  --rule:       #E1DCD2;
  --rule-2:     #CDC6B9;
  --rule-3:     #B4AC9C;

  /* --- Accent: muted koji gold-brown ------------------------- */
  --accent:     #7C6B52;
  --accent-2:   #A08F73;
  --accent-pale:#E9E2D2;

  /* --- Pale semantic hues (chips, panels, diagram fills) ----- */
  --h-rice:     #F0EDE4;
  --h-water:    #E0E7E9;
  --h-koji:     #EDE5D2;
  --h-yeast:    #E6E2EC;
  --h-wood:     #E7DFD2;
  --h-moss:     #E0E6DB;
  --h-plum:     #EEE1DF;
  --h-amber:    #EADCC1;
  --h-snow:     #E9ECEE;
  --h-ash:      #E6E4E0;

  /* --- Metrics ---------------------------------------------- */
  --rail:       232px;
  --toc:        208px;
  --measure:    72ch;
  --bar:        57px;
  --gut:        40px;

  /* --- Type -------------------------------------------------- */
  --sans: "IBM Plex Sans", "Helvetica Neue", Helvetica, Arial,
          "Hiragino Sans", "Yu Gothic", "Yu Gothic UI", "Meiryo",
          "Noto Sans JP", "Noto Sans TC", "Microsoft JhengHei",
          "PingFang TC", sans-serif;
  --serif: "Spectral", "Iowan Old Style", "Palatino Linotype", Palatino, Georgia,
           "Hiragino Mincho ProN", "Yu Mincho", "YuMincho",
           "Noto Serif JP", "Noto Serif TC", "Songti TC", "MS Mincho", serif;
  --mono: "SF Mono", "JetBrains Mono", "Consolas", "Menlo", monospace;

  /* --- Derived surfaces -------------------------------------- */
  --bar-bg:     rgba(251,250,247,.94);
  --scrim:      rgba(32,30,27,.26);
}

/* =============================================================
   Dark theme. Same discipline: warm, low-chroma, no pure black,
   no shadows, hairline rules, every corner square.
   Applied by an explicit data-theme attribute so the choice in
   the menu always wins over the operating system.
   ============================================================= */
html[data-theme="dark"]{
  color-scheme: dark;

  --paper:      #16150F;
  --paper-2:    #1D1C16;
  --paper-3:    #26241D;
  --paper-4:    #2F2D24;

  --ink:        #E9E5DA;
  --ink-2:      #BDB7A8;
  --ink-3:      #8E887B;
  --ink-4:      #6F695E;

  --rule:       #2C2A22;
  --rule-2:     #3C382D;
  --rule-3:     #534E40;

  --accent:     #C6B08A;
  --accent-2:   #A3916F;
  --accent-pale:#39331F;

  --h-rice:     #262319;
  --h-water:    #1B2326;
  --h-koji:     #292316;
  --h-yeast:    #24212E;
  --h-wood:     #282218;
  --h-moss:     #1F261E;
  --h-plum:     #2B2220;
  --h-amber:    #2E2516;
  --h-snow:     #1D2123;
  --h-ash:      #24231E;

  --bar-bg:     rgba(22,21,15,.94);
  --scrim:      rgba(0,0,0,.44);
}

/* --- Language-aware type: JA/ZH prefer their own stacks ------ */
html[lang="ja"]{
  --sans: "IBM Plex Sans", "Hiragino Sans", "Yu Gothic", "Yu Gothic UI", "Meiryo",
          "Noto Sans JP", "Helvetica Neue", Arial, sans-serif;
  --serif: "Spectral", "Hiragino Mincho ProN", "Yu Mincho", "YuMincho", "MS Mincho",
           "Noto Serif JP", Georgia, serif;
}
html[lang="zh-Hant"]{
  --sans: "IBM Plex Sans", "PingFang TC", "Microsoft JhengHei", "Noto Sans TC",
          "Hiragino Sans TC", "Helvetica Neue", Arial, sans-serif;
  --serif: "Spectral", "Songti TC", "PMingLiU", "Noto Serif TC", "MingLiU", Georgia, serif;
}

*,*::before,*::after{ box-sizing:border-box; border-radius:0 !important; }

html{ -webkit-text-size-adjust:100%; scroll-behavior:smooth; scroll-padding-top:calc(var(--bar) + 24px); }

body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:var(--sans);
  font-size:15px;
  line-height:1.75;
  font-feature-settings:"kern" 1,"liga" 1;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}

::selection{ background:var(--accent-pale); color:var(--ink); }

:focus-visible{ outline:2px solid var(--ink); outline-offset:2px; }
a:focus-visible{ outline-offset:3px; }

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{ transition-duration:.01ms !important; animation-duration:.01ms !important; scroll-behavior:auto !important; }
  html{ scroll-behavior:auto; }
}

/* ============================ Type ========================== */
h1,h2,h3,h4,h5{ margin:0; font-weight:500; line-height:1.3; letter-spacing:-0.01em; text-wrap:balance; }

.h-display{
  font-family:var(--serif);
  font-size:clamp(34px,5.2vw,58px);
  line-height:1.12;
  font-weight:400;
  letter-spacing:-0.02em;
}
h1{ font-family:var(--serif); font-size:clamp(28px,3.4vw,40px); font-weight:400; letter-spacing:-0.015em; }
h2{ font-size:clamp(19px,2vw,23px); letter-spacing:0.005em; }
h3{ font-size:16px; }
h4{ font-size:14px; }

p{ margin:0 0 1.05em; max-width:var(--measure); }
p:last-child{ margin-bottom:0; }

a{ color:var(--accent); text-decoration:none; border-bottom:1px solid var(--rule-2); transition:border-color .12s, color .12s; }
a:hover{ color:var(--ink); border-bottom-color:var(--ink); }

strong,b{ font-weight:600; color:var(--ink); }
em{ font-style:italic; }
small{ font-size:12px; }
hr{ border:0; border-top:1px solid var(--rule); margin:40px 0; }

code,kbd{ font-family:var(--mono); font-size:.86em; background:var(--paper-3); padding:1px 5px; border:1px solid var(--rule); }

/* Japanese / romaji inline furniture */
.jp{ font-family:var(--serif); }
.romaji{ font-style:italic; color:var(--ink-2); }
.kana{ font-size:.82em; color:var(--ink-3); letter-spacing:.02em; }

.eyebrow{
  font-size:10.5px; letter-spacing:.22em; text-transform:uppercase;
  color:var(--ink-3); font-weight:600; margin:0 0 14px;
}
.lede{ font-size:17px; line-height:1.72; color:var(--ink-2); max-width:64ch; }
.muted{ color:var(--ink-3); }
.tiny{ font-size:11.5px; letter-spacing:.06em; color:var(--ink-3); }

/* Numerals in tables/figures */
.num{ font-variant-numeric:tabular-nums; font-feature-settings:"tnum" 1; }

/* ========================== Skeleton ======================== */
.wrap{ max-width:1440px; margin:0 auto; padding:0 var(--gut); }

/* --- Top bar ------------------------------------------------ */
.topbar{
  position:sticky; top:0; z-index:60;
  background:var(--bar-bg);
  backdrop-filter:saturate(120%) blur(8px);
  border-bottom:1px solid var(--rule);
}
.topbar-in{
  max-width:1440px; margin:0 auto; padding:0 var(--gut);
  height:var(--bar); display:flex; align-items:center; gap:20px;
}
.brand{
  display:flex; align-items:baseline; gap:10px;
  border:0; color:var(--ink); flex:0 0 auto;
}
.brand:hover{ color:var(--ink); }
.brand-mark{
  font-family:var(--serif); font-size:19px; letter-spacing:.30em;
  text-transform:uppercase; font-weight:400;
}
.brand-masu{
  flex:0 0 auto; width:15px; height:15px; position:relative;
  border:1px solid var(--ink-2); align-self:center; margin-right:2px;
}
.brand-masu::after{
  content:""; position:absolute; inset:3px; border:1px solid var(--rule-3);
}
.brand:hover .brand-masu{ border-color:var(--ink); }
.brand-jp{ font-family:var(--serif); font-size:13px; color:var(--ink-3); letter-spacing:.14em; }

.topbar-spacer{ flex:1 1 auto; }

/* --- Side menu: opened from the hamburger, top right ---------- */
.menubtn{ flex:0 0 auto; }

.sidemenu{
  position:fixed; top:var(--bar); right:0;
  width:min(340px,88vw); height:calc(100vh - var(--bar));
  background:var(--paper); border-left:1px solid var(--rule-2);
  padding:26px 24px 60px; overflow-y:auto; overscroll-behavior:contain;
  transform:translateX(101%); transition:transform .22s ease;
  z-index:58;
}
.sidemenu.is-open{ transform:translateX(0); }
@media (prefers-reduced-motion: reduce){ .sidemenu{ transition:none; } }

.menu-group{ margin-bottom:24px; }
.sidemenu > .menu-group:first-child{ margin-bottom:26px; }
.menu-group h5{
  font-size:10px; letter-spacing:.2em; text-transform:uppercase;
  color:var(--ink-4); font-weight:600; margin:0 0 10px;
}
.menu-group a{
  display:block; padding:5px 0 5px 12px; border:0;
  border-left:2px solid transparent;
  font-size:13.5px; color:var(--ink-2); line-height:1.5;
  transition:color .12s,border-color .12s;
}
.menu-group a:hover{ color:var(--ink); border-left-color:var(--rule-2); }
.menu-group a.is-active{ color:var(--ink); border-left-color:var(--ink); font-weight:600; }
.menu-group a .rail-jp{
  display:block; font-size:10.5px; color:var(--ink-4);
  letter-spacing:.06em; font-weight:400; margin-top:1px;
}
.menu-nav{ border-top:1px solid var(--rule); padding-top:22px; }

.langrow{
  display:flex; width:100%; align-items:baseline; justify-content:space-between; gap:12px;
  appearance:none; background:transparent; cursor:pointer;
  border:1px solid var(--rule); border-bottom:0;
  font-family:var(--sans); text-align:left;
  padding:9px 12px; color:var(--ink-2);
  transition:background .12s,color .12s;
}
.langrow:last-of-type{ border-bottom:1px solid var(--rule); }
.langrow:hover{ background:var(--paper-2); color:var(--ink); }
.langrow.is-on{ background:var(--ink); border-color:var(--ink); color:var(--paper); }
.langrow.is-on + .langrow{ border-top-color:var(--ink); }
.langrow-n{ font-size:13.5px; }
.langrow-c{ font-size:10px; letter-spacing:.16em; opacity:.72; }

.scrim{
  position:fixed; inset:var(--bar) 0 0 0;
  background:var(--scrim); z-index:57;
}

/* --- Icon buttons ------------------------------------------- */
.iconbtn{
  appearance:none; background:transparent; border:1px solid var(--rule-2);
  width:31px; height:31px; display:inline-flex; align-items:center; justify-content:center;
  cursor:pointer; color:var(--ink-2); padding:0; transition:background .12s,color .12s;
}
.iconbtn:hover{ background:var(--paper-3); color:var(--ink); }
.iconbtn svg{ width:15px; height:15px; }


/* --- Page grid ---------------------------------------------- */
.shell{
  max-width:1440px; margin:0 auto; padding:0 var(--gut);
  display:grid; grid-template-columns:var(--rail) minmax(0,1fr) var(--toc);
  gap:0;
  align-items:start;
}

/* --- Left rail ---------------------------------------------- */
.rail{
  position:sticky; top:var(--bar); align-self:start;
  height:calc(100vh - var(--bar));
  overflow-y:auto; overscroll-behavior:contain;
  padding:34px 26px 60px 0;
  border-right:1px solid var(--rule);
 
}

.rail-group{ margin-bottom:26px; }
.rail-group h5{
  font-size:10px; letter-spacing:.2em; text-transform:uppercase;
  color:var(--ink-4); font-weight:600; margin:0 0 9px;
}
.rail a{
  display:block; padding:4px 0 4px 12px; border:0;
  border-left:2px solid transparent;
  font-size:13.5px; color:var(--ink-2); line-height:1.5;
  transition:color .12s,border-color .12s,background .12s;
}
.rail a:hover{ color:var(--ink); border-left-color:var(--rule-2); }
.rail a.is-active{ color:var(--ink); border-left-color:var(--ink); font-weight:600; }
.rail a .rail-jp{ display:block; font-size:10.5px; color:var(--ink-4); letter-spacing:.06em; }

/* --- Main --------------------------------------------------- */
main{ padding:52px 56px 140px; min-width:0; }
main.full{ grid-column:2 / -1; }

/* --- Right TOC ---------------------------------------------- */
.toc{
  position:sticky; top:var(--bar); align-self:start;
  height:calc(100vh - var(--bar)); overflow-y:auto;
  padding:52px 0 60px 0; border-left:1px solid var(--rule);
  padding-left:22px;
}
.toc h5{
  font-size:10px; letter-spacing:.2em; text-transform:uppercase;
  color:var(--ink-4); font-weight:600; margin:0 0 11px;
}
.toc a{
  display:block; font-size:12.5px; line-height:1.5; color:var(--ink-3);
  padding:3px 0 3px 10px; border:0; border-left:1px solid var(--rule);
}
.toc a:hover{ color:var(--ink); border-left-color:var(--rule-3); }
.toc a.is-active{ color:var(--ink); border-left-color:var(--ink); }
.toc a.lvl3{ padding-left:22px; font-size:12px; color:var(--ink-4); }

/* ====================== Page furniture ====================== */
.pagehead{ border-bottom:1px solid var(--rule); padding-bottom:30px; margin-bottom:44px; }
.pagehead .kicker{
  font-size:10.5px; letter-spacing:.22em; text-transform:uppercase;
  color:var(--ink-3); font-weight:600; margin-bottom:16px;
  display:flex; align-items:center; gap:12px;
}
.pagehead .kicker::after{ content:""; flex:1; height:1px; background:var(--rule); }
.pagehead h1{ margin-bottom:14px; }
.pagehead .sub{ font-family:var(--serif); font-size:15px; color:var(--ink-3); margin:-8px 0 16px; letter-spacing:.06em; }

section.block{ margin:0 0 66px; scroll-margin-top:calc(var(--bar) + 20px); }
section.block > h2{
  padding-bottom:11px; border-bottom:1px solid var(--rule);
  margin-bottom:22px; display:flex; align-items:baseline; gap:12px; flex-wrap:wrap;
}
section.block > h2 .h2-jp{ font-family:var(--serif); font-size:13px; color:var(--ink-3); font-weight:400; letter-spacing:.1em; }
section.block h3{ margin:34px 0 12px; letter-spacing:0; }
section.block h4{ margin:22px 0 8px; color:var(--ink-2); }

/* ========================== Panels ========================== */
.panel{ border:1px solid var(--rule); background:var(--paper-2); padding:22px 24px; margin:24px 0; }
.panel.tint-rice { background:var(--h-rice); }
.panel.tint-water{ background:var(--h-water); }
.panel.tint-koji { background:var(--h-koji); }
.panel.tint-yeast{ background:var(--h-yeast); }
.panel.tint-wood { background:var(--h-wood); }
.panel.tint-moss { background:var(--h-moss); }
.panel.tint-amber{ background:var(--h-amber); }
.panel.tint-snow { background:var(--h-snow); }
.panel.tint-plum { background:var(--h-plum); }
.panel > :first-child{ margin-top:0; }
.panel h4{ margin-top:0; font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-2); }

.note{ border-left:2px solid var(--rule-3); padding:2px 0 2px 18px; margin:22px 0; color:var(--ink-2); font-size:14px; }
.note .note-label{ display:block; font-size:10px; letter-spacing:.2em; text-transform:uppercase; color:var(--ink-4); font-weight:600; margin-bottom:5px; }

blockquote{
  margin:26px 0; padding:0 0 0 22px; border-left:2px solid var(--rule-2);
  font-family:var(--serif); font-size:17px; line-height:1.65; color:var(--ink-2);
}
blockquote cite{ display:block; margin-top:10px; font-family:var(--sans); font-size:11.5px; font-style:normal; letter-spacing:.1em; color:var(--ink-4); text-transform:uppercase; }

/* ========================== Tables ========================== */
.tablewrap{ overflow-x:auto; margin:22px 0; border:1px solid var(--rule); }
table{ border-collapse:collapse; width:100%; font-size:13px; background:var(--paper); }
caption{ caption-side:top; text-align:left; font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-3); padding:12px 14px; background:var(--paper-2); border-bottom:1px solid var(--rule); font-weight:600; }
th,td{ text-align:left; padding:9px 14px; border-bottom:1px solid var(--rule); vertical-align:top; line-height:1.55; }
thead th{ background:var(--paper-2); font-weight:600; font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-2); white-space:nowrap; }
tbody tr:last-child td{ border-bottom:0; }
tbody tr:hover{ background:var(--paper-2); }
td.num,th.num{ font-variant-numeric:tabular-nums; white-space:nowrap; }
.t-key{ font-weight:600; }
.t-jp{ font-family:var(--serif); color:var(--ink-2); }
td.t-jp{ white-space:nowrap; }

/* ========================== Lists =========================== */
ul,ol{ margin:0 0 1.05em; padding-left:1.15em; max-width:var(--measure); }
li{ margin-bottom:.4em; }
ul.plain{ list-style:none; padding-left:0; }
ul.plain li{ padding-left:16px; position:relative; }
ul.plain li::before{ content:""; position:absolute; left:0; top:.72em; width:7px; height:1px; background:var(--rule-3); }

dl.defs{ margin:20px 0; }
dl.defs dt{ font-weight:600; font-size:13.5px; margin-top:15px; display:flex; gap:9px; align-items:baseline; flex-wrap:wrap; }
dl.defs dt .t-jp{ font-weight:400; font-size:12.5px; }
dl.defs dd{ margin:2px 0 0; padding-left:0; color:var(--ink-2); font-size:14px; max-width:var(--measure); }

/* ========================== Grids =========================== */
.grid{ display:grid; gap:1px; background:var(--rule); border:1px solid var(--rule); margin:24px 0; }
.grid.c2{ grid-template-columns:repeat(2,minmax(0,1fr)); }
.grid.c3{ grid-template-columns:repeat(3,minmax(0,1fr)); }
.grid.c4{ grid-template-columns:repeat(4,minmax(0,1fr)); }
.grid > .cell{ background:var(--paper); padding:20px 22px; }
.grid > .cell > :first-child{ margin-top:0; }
.grid > .cell h3,.grid > .cell h4{ margin-top:0; }
.cell-k{ font-size:10px; letter-spacing:.2em; text-transform:uppercase; color:var(--ink-4); font-weight:600; margin-bottom:8px; }
.cell-v{ font-family:var(--serif); font-size:26px; line-height:1.15; letter-spacing:-.01em; }
.cell-v small{ font-family:var(--sans); font-size:12px; color:var(--ink-3); letter-spacing:.04em; }

/* ========================== Chips =========================== */
.chips{ display:flex; flex-wrap:wrap; gap:6px; margin:14px 0; }
.chip{
  display:inline-block; font-size:11px; letter-spacing:.06em;
  padding:3px 9px; border:1px solid var(--rule-2); background:var(--paper-2);
  color:var(--ink-2); white-space:nowrap;
}
.chip.rice { background:var(--h-rice); }
.chip.water{ background:var(--h-water); }
.chip.koji { background:var(--h-koji); }
.chip.yeast{ background:var(--h-yeast); }
.chip.wood { background:var(--h-wood); }
.chip.moss { background:var(--h-moss); }
.chip.amber{ background:var(--h-amber); }
.chip.plum { background:var(--h-plum); }
.chip.snow { background:var(--h-snow); }

/* ========================== Figures ========================= */
figure{ margin:26px 0; }
figure svg{ display:block; width:100%; height:auto; }
figcaption{ font-size:11.5px; color:var(--ink-3); margin-top:9px; line-height:1.55; letter-spacing:.02em; }
.figframe{ border:1px solid var(--rule); background:var(--paper-2); padding:22px; overflow-x:auto; }

/* ========================= Utilities ======================== */
.stack-s > * + *{ margin-top:8px; }
.stack-m > * + *{ margin-top:18px; }
.row{ display:flex; gap:14px; flex-wrap:wrap; align-items:center; }
.sep{ height:1px; background:var(--rule); margin:34px 0; border:0; }
.center{ text-align:center; }
.nowrap{ white-space:nowrap; }
.hide{ display:none !important; }
.sr{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }

/* ========================= Footer =========================== */
.foot{ border-top:1px solid var(--rule); margin-top:70px; padding:34px 0 60px; font-size:12px; color:var(--ink-3); }
.foot .foot-in{ display:flex; gap:34px; flex-wrap:wrap; justify-content:space-between; }
.foot a{ color:var(--ink-2); border-bottom-color:var(--rule); }

/* ========================= Prev / Next ====================== */
.pager{ display:grid; grid-template-columns:1fr 1fr; gap:1px; background:var(--rule); border:1px solid var(--rule); margin-top:60px; }
.pager a{ background:var(--paper); padding:20px 22px; border:0; display:block; color:var(--ink); }
.pager a:hover{ background:var(--paper-2); }
.pager .pg-k{ font-size:10px; letter-spacing:.2em; text-transform:uppercase; color:var(--ink-4); font-weight:600; display:block; margin-bottom:6px; }
.pager .pg-t{ font-family:var(--serif); font-size:17px; }
.pager a.next{ text-align:right; }
.pager .empty{ background:var(--paper-2); }

/* ======================== Timeline ========================== */
.timeline{ margin:26px 0; border-top:1px solid var(--rule); }
.tl-item{ display:grid; grid-template-columns:132px minmax(0,1fr); gap:0; border-bottom:1px solid var(--rule); }
.tl-when{ padding:18px 18px 18px 0; border-right:1px solid var(--rule); }
.tl-year{ font-family:var(--serif); font-size:19px; line-height:1.15; letter-spacing:-.01em; }
.tl-era{ font-size:10.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-4); margin-top:5px; font-weight:600; }
.tl-era .t-jp{ display:block; text-transform:none; letter-spacing:.08em; font-weight:400; font-size:11px; }
.tl-body{ padding:18px 0 18px 22px; }
.tl-body h4{ margin:0 0 5px; font-size:14.5px; }
.tl-body h4 .t-jp{ font-weight:400; font-size:12.5px; color:var(--ink-3); margin-left:7px; }
.tl-body p{ margin:0; font-size:14px; color:var(--ink-2); }
.tl-body p + p{ margin-top:.7em; }

/* ========================== Steps =========================== */
.steps{ margin:26px 0; }
.step{ display:grid; grid-template-columns:56px minmax(0,1fr); border-top:1px solid var(--rule); }
.steps .step:last-child{ border-bottom:1px solid var(--rule); }
.step-n{
  padding:18px 0; font-family:var(--serif); font-size:15px; color:var(--ink-3);
  border-right:1px solid var(--rule); text-align:left;
  font-variant-numeric:tabular-nums;
}
.step-b{ padding:18px 0 18px 22px; }
.step-b h4{ margin:0 0 4px; font-size:15px; display:flex; gap:10px; align-items:baseline; flex-wrap:wrap; }
.step-b h4 .t-jp{ font-weight:400; font-size:13px; color:var(--ink-2); }
.step-b h4 .romaji{ font-size:12px; }
.step-meta{ font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-4); margin:0 0 8px; font-weight:600; }
.step-b p{ margin:0 0 .75em; font-size:14px; color:var(--ink-2); }
.step-b p:last-child{ margin-bottom:0; }

/* ========================== Scale =========================== */
.scale{ margin:26px 0; border:1px solid var(--rule); background:var(--paper-2); padding:24px 26px 18px; }
.scale-bar{ position:relative; height:36px; border-bottom:1px solid var(--rule-3); margin-bottom:8px; }
.scale-seg{ position:absolute; top:0; height:36px; border-left:1px solid var(--rule-2); }
.scale-seg:first-child{ border-left:0; }
.scale-lab{ position:absolute; bottom:-1px; left:0; padding:0 0 6px 7px; font-size:11px; color:var(--ink-2); white-space:nowrap; }
.scale-legend{ display:none; }
.scale-lgi{ display:inline-flex; align-items:center; gap:6px; font-size:11px; color:var(--ink-2); }
.scale-lgi i{ display:inline-block; width:10px; height:10px; border:1px solid var(--rule-2); flex:0 0 auto; }
.scale-ticks{ display:flex; justify-content:space-between; font-size:11px; color:var(--ink-4); font-variant-numeric:tabular-nums; }
.scale-note{ font-size:12px; color:var(--ink-3); margin-top:12px; }

/* ========================== Matrix ========================== */
.matrix{ margin:26px 0; overflow-x:auto; border:1px solid var(--rule); }
.matrix table{ min-width:560px; }
.matrix td.mx{ background:var(--paper-2); }
.matrix td.mx strong{ display:block; font-size:14px; margin-bottom:3px; }
.matrix td.mx .t-jp{ display:block; font-size:12px; color:var(--ink-2); margin-bottom:6px; white-space:normal; }
.matrix td.mx span.mx-d{ font-size:12px; color:var(--ink-3); line-height:1.5; display:block; }
.matrix th.axis{ background:var(--paper-3); font-size:10px; }

/* ====================== Compare columns ===================== */
.compare{ display:grid; gap:1px; background:var(--rule); border:1px solid var(--rule); margin:26px 0; }
.compare > div{ background:var(--paper); padding:18px 20px; }
.compare h4{ margin:0 0 10px; font-size:13px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-2); }
.compare h4 .t-jp{ text-transform:none; letter-spacing:.04em; color:var(--ink-3); font-weight:400; }
.compare p{ font-size:13.5px; color:var(--ink-2); margin:0; }

/* ==================== Glossary index ======================== */
.gloss-filter{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin:20px 0 8px; }
.gloss-filter input{
  font-family:var(--sans); font-size:14px; padding:8px 12px; border:1px solid var(--rule-2);
  background:var(--paper); color:var(--ink); min-width:240px; flex:1 1 240px; outline:none;
}
.gloss-filter input:focus{ border-color:var(--ink-3); }
.gloss-count{ font-size:11.5px; color:var(--ink-4); letter-spacing:.08em; }
.gloss-list{ border-top:1px solid var(--rule); margin-top:14px; }
.gloss-row{ display:grid; grid-template-columns:210px minmax(0,1fr); border-bottom:1px solid var(--rule); }
.gloss-term{ padding:13px 16px 13px 0; border-right:1px solid var(--rule); }
.gloss-term .g-r{ font-weight:600; font-size:13.5px; }
.gloss-term .g-j{ font-family:var(--serif); font-size:13px; color:var(--ink-2); display:block; margin-top:2px; }
.gloss-def{ padding:13px 0 13px 18px; font-size:13.5px; color:var(--ink-2); }
.gloss-cat{ font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:var(--ink-4); font-weight:600; display:block; margin-top:4px; }


/* ==================== Brand directory ======================= */
/* One entry is a two-column record: the identity block on the
   left, the house note and the standing products on the right.
   Hairlines only; the left column is separated by a rule rather
   than by a box, so a run of a hundred entries reads as a list
   and not as a hundred cards.                                  */
.brands{ margin:22px 0 8px; }
.brandlist{ border-top:1px solid var(--rule-2); }

.brandgroup{
  font-size:11px; letter-spacing:.2em; text-transform:uppercase;
  font-weight:600; color:var(--ink-2);
  margin:0; padding:26px 0 9px;
  border-bottom:1px solid var(--rule-2);
}
.brandgroup .t-jp{
  text-transform:none; letter-spacing:.08em; font-weight:400;
  color:var(--ink-4); font-family:var(--serif); font-size:12.5px;
  margin-left:8px;
}
.brandlist > .brandgroup:first-child{ padding-top:10px; }

.kura{
  display:grid; grid-template-columns:200px minmax(0,1fr);
  border-bottom:1px solid var(--rule);
}
.kura-id{ padding:16px 18px 16px 0; border-right:1px solid var(--rule); }
.kura-body{ padding:16px 0 16px 20px; }

.bn{ line-height:1.2; }
.bn-j{ font-family:var(--serif); font-size:17px; color:var(--ink); }
.bn-r{ font-size:11.5px; letter-spacing:.09em; color:var(--ink-3); }
.bh{ font-size:12.5px; color:var(--ink-2); margin-top:5px; line-height:1.45; }
.bh .t-jp{ font-family:var(--serif); }
.bm{
  display:flex; gap:10px; justify-content:space-between; align-items:baseline;
  margin-top:7px; font-size:10.5px; letter-spacing:.14em;
  text-transform:uppercase; color:var(--ink-4);
}
.bm .best{ letter-spacing:.06em; }

.bnote{ font-size:13.5px; color:var(--ink-2); margin:0 0 10px; line-height:1.62; }

.bprods{ list-style:none; margin:0; padding:0; border-top:1px solid var(--rule); }
.bprods li{ padding:9px 0 9px; border-bottom:1px solid var(--rule); }
.bprods li:last-child{ border-bottom:0; padding-bottom:0; }
.bp-n{
  font-family:var(--serif); font-size:14px; color:var(--ink);
  display:block; margin-bottom:2px;
}
.bp-n .bp-r{
  font-family:var(--sans); font-style:normal; font-size:11px;
  letter-spacing:.08em; color:var(--ink-4); margin-left:7px;
}
.bp-s{ display:block; font-size:11.5px; color:var(--ink-2); letter-spacing:.02em; }
.bp-s b{ font-weight:600; color:var(--accent); letter-spacing:.04em; }
.bp-m{ color:var(--ink-3); }
.bp-sep{ color:var(--rule-3); margin:0 7px; }
.bp-u{ color:var(--ink-4); }
.bp-d{ display:block; font-size:12.5px; color:var(--ink-3); margin-top:3px; line-height:1.55; }

/* ==================== Rice cross-index ====================== */
.riceidx{ border-top:1px solid var(--rule-2); margin:22px 0 8px; }
.riceidx-row{
  display:grid; grid-template-columns:200px minmax(0,1fr);
  border-bottom:1px solid var(--rule);
}
.ri-k{
  position:relative; padding:13px 40px 13px 0;
  border-right:1px solid var(--rule);
}
.ri-j{ font-family:var(--serif); font-size:15px; color:var(--ink); }
.ri-r{ font-size:11px; letter-spacing:.08em; color:var(--ink-4); margin-left:8px; }
.ri-n{ position:absolute; top:14px; right:18px; font-size:11px; color:var(--ink-3); }
.ri-b{ padding:13px 0 13px 20px; font-size:13px; line-height:1.9; }
.ri-b a{
  font-family:var(--serif); color:var(--ink-2);
  border-bottom:1px solid var(--rule-2); text-decoration:none;
}
.ri-b a:hover{ color:var(--ink); border-bottom-color:var(--ink-3); }
.ri-sep{ color:var(--rule-3); margin:0 7px; }

/* ========================= Responsive ======================= */
@media (max-width:1240px){
  .shell{ grid-template-columns:var(--rail) minmax(0,1fr); }
  .toc{ display:none; }
  main{ padding-right:0; }
}
@media (max-width:900px){
  :root{ --gut:22px; }
  .shell{ grid-template-columns:minmax(0,1fr); }
  .rail{ display:none; }
  main{ padding:34px 0 100px; }
  .grid.c3,.grid.c4{ grid-template-columns:repeat(2,minmax(0,1fr)); }
  .brand-jp{ display:none; }
}
@media (max-width:760px){
  .chip{ white-space:normal; }
  .scale{ padding:20px 18px 16px; }
  .scale-lab{ display:none; }
  .scale-legend{ display:flex; flex-wrap:wrap; gap:6px 16px; margin:10px 0 2px; }
}
@media (max-width:860px){
  .kura{ grid-template-columns:150px minmax(0,1fr); }
  .kura-id{ padding-right:14px; }
  .kura-body{ padding-left:15px; }
}
@media (max-width:640px){
  .riceidx-row{ grid-template-columns:minmax(0,1fr); }
  .ri-k{ border-right:0; padding:14px 40px 0 0; }
  .ri-n{ top:15px; right:0; }
  .ri-b{ padding:7px 0 14px; }
  .kura{ grid-template-columns:minmax(0,1fr); }
  .kura-id{ border-right:0; padding:16px 0 0; }
  .kura-body{ padding:9px 0 16px; }
  .bm{ justify-content:flex-start; gap:14px; }
  .gloss-row{ grid-template-columns:minmax(0,1fr); }
  .gloss-term{ border-right:0; padding-bottom:0; }
  .gloss-def{ padding-left:0; padding-top:6px; }
  .tl-item{ grid-template-columns:minmax(0,1fr); }
  .tl-when{ border-right:0; padding:16px 0 0; }
  .tl-body{ padding-left:0; }
  .step{ grid-template-columns:34px minmax(0,1fr); }
  .step-b{ padding-left:14px; }
}
@media (max-width:560px){
  body{ font-size:14.5px; }
  .grid.c2,.grid.c3,.grid.c4{ grid-template-columns:minmax(0,1fr); }
  .pager{ grid-template-columns:1fr; }
  .pager a.next{ text-align:left; }
  .topbar-in{ gap:12px; }
}

@media print{
  .topbar,.rail,.toc,.pager,.scrim,.sidemenu{ display:none !important; }
  .shell{ display:block; } main{ padding:0; }
  body{ background:#fff; font-size:11pt; }
  a{ border:0; color:inherit; }
}

/* ========================== Search ========================== */
.searchwrap{ position:relative; flex:1 1 180px; max-width:320px; margin-left:auto; }
.searchbox{
  width:100%; font-family:var(--sans); font-size:13px; line-height:1.5;
  padding:6px 10px; border:1px solid var(--rule-2);
  background:var(--paper); color:var(--ink); outline:none;
  -webkit-appearance:none; appearance:none;
}
.searchbox:focus{ border-color:var(--ink-3); }
.searchbox::placeholder{ color:var(--ink-4); letter-spacing:.04em; }
.searchbox::-webkit-search-cancel-button{ display:none; }

.results{
  position:absolute; top:calc(100% + 7px); right:0;
  width:min(480px,86vw); background:var(--paper);
  border:1px solid var(--rule-2); max-height:min(62vh,520px);
  overflow-y:auto; z-index:70;
}
.results a{
  display:flex; gap:14px; align-items:baseline; justify-content:space-between;
  padding:8px 13px; border:0; border-bottom:1px solid var(--rule);
  color:var(--ink); font-size:13px; line-height:1.45;
}
.results a:last-child{ border-bottom:0; }
.results a:hover{ background:var(--paper-2); color:var(--ink); }
.results a.sel{ background:var(--paper-3); color:var(--ink); }
.results .r-t{ flex:1 1 auto; min-width:0; }
.results .r-j{ font-family:var(--serif); color:var(--ink-3); font-size:12px; margin-left:7px; }
.results .r-p{
  flex:0 0 auto; font-size:9.5px; letter-spacing:.14em; text-transform:uppercase;
  color:var(--ink-4); white-space:nowrap;
}
.results .r-empty{ padding:13px; font-size:12.5px; color:var(--ink-3); }

@media (max-width:900px){
  .searchwrap{ flex:1 1 120px; max-width:none; }
}
@media (max-width:560px){
  .searchbox{ font-size:12px; padding:5px 8px; }
  .results{ width:min(94vw,480px); right:-40px; }
}
@media print{ .searchwrap,.sidemenu,.scrim{ display:none !important; } }

/* Pages with no in-page headings give their column back to the text */
.shell.no-toc{ grid-template-columns:var(--rail) minmax(0,1fr); }
.shell.no-toc main{ padding-right:0; }

/* ========================== Related ========================= */
.related{ margin:46px 0 0; padding-top:24px; border-top:1px solid var(--rule); }
.related-h{ font-size:10px; letter-spacing:.2em; text-transform:uppercase; color:var(--ink-4); font-weight:600; margin:0 0 16px; }
.related-list{ list-style:none; margin:0; padding:0; display:grid; grid-template-columns:repeat(2,1fr); gap:16px 30px; }
.related-list li{ margin:0; font-size:13.5px; line-height:1.5; }
.related-list a{ font-weight:600; }
.rel-jp{ font-size:11.5px; color:var(--ink-4); margin-left:6px; }
.rel-why{ display:block; color:var(--ink-3); font-size:12.5px; line-height:1.55; margin-top:3px; }
@media (max-width:760px){ .related-list{ grid-template-columns:1fr; gap:14px; } }

/* ========================== Figure index ==================== */
.figindex{ margin:26px 0; display:grid; grid-template-columns:repeat(2,1fr); gap:26px 34px; }
.figindex-group{ border-top:1px solid var(--rule); padding-top:12px; }
.figindex-page{ font-size:13px; font-weight:600; margin-bottom:7px; }
.figindex-item{ font-size:12.5px; line-height:1.5; color:var(--ink-3); margin:0 0 5px; }
.figindex-item a{ color:var(--ink-2); text-decoration:none; border-bottom:1px solid transparent; }
.figindex-item a:hover{ border-bottom-color:var(--rule-2); }
@media (max-width:760px){ .figindex{ grid-template-columns:1fr; gap:20px; } }

/* ========================== Theme rows ====================== */
.themerow{
  display:flex; width:100%; align-items:center; gap:10px;
  appearance:none; background:transparent; cursor:pointer;
  border:1px solid var(--rule); border-bottom:0;
  font-family:var(--sans); text-align:left;
  padding:9px 12px; color:var(--ink-2);
  transition:background .12s,color .12s;
}
.themerow:last-of-type{ border-bottom:1px solid var(--rule); }
.themerow:hover{ background:var(--paper-2); color:var(--ink); }
.themerow.is-on{ background:var(--ink); border-color:var(--ink); color:var(--paper); }
.themerow.is-on + .themerow{ border-top-color:var(--ink); }
.themerow svg{ width:14px; height:14px; flex:0 0 auto; }
.themerow-n{ font-size:13.5px; }

/* ========================== Colophon ======================== */
.colophon{
  margin-top:30px; padding-top:20px;
  border-top:1px solid var(--rule);
  font-size:12px; line-height:1.65; color:var(--ink-3);
}
.colophon .colo-t{
  font-family:var(--serif); font-size:13.5px; letter-spacing:.12em;
  text-transform:uppercase; color:var(--ink-2); margin:0 0 8px;
}
.colophon p{ margin:0 0 7px; max-width:none; }
.colophon a{
  display:inline; padding:0; border:0; border-bottom:1px solid var(--rule-2);
  color:var(--ink-2); font-size:12px; line-height:1.65;
}
.colophon a:hover{ color:var(--ink); border-bottom-color:var(--ink); }
.colophon .colo-ed{ font-family:var(--mono); font-size:10.5px; letter-spacing:.06em; color:var(--ink-4); }
.colo-links{ margin-top:10px; }
.colophon .colo-links a{ display:inline-block; }
.colophon .colo-links > div{ margin-bottom:5px; }

/* ================ Responsive: figures on a phone ============ */
/* A 760-unit diagram scaled into a 320px screen makes 9.5px type
   into 4px type. Below this width the figure keeps a legible size
   and its frame scrolls sideways instead. */
@media (max-width:700px){
  figure svg{ min-width:600px; }
  .figframe{ -webkit-overflow-scrolling:touch; padding:16px; }
  .figframe::after{
    content:attr(data-hint); display:block; position:sticky; left:0;
    margin-top:10px; font-size:10px; letter-spacing:.12em;
    text-transform:uppercase; color:var(--ink-4);
  }
}
@media (max-width:560px){
  .brand-mark{ font-size:15px; letter-spacing:.18em; }
  .brand{ gap:7px; }
  .topbar-in{ gap:10px; }
  .tablewrap::after{
    content:attr(data-hint); display:block; position:sticky; left:0;
    padding:6px 10px; font-size:10px; letter-spacing:.12em;
    text-transform:uppercase; color:var(--ink-4); border-top:1px solid var(--rule);
  }
  .figframe{ padding:14px 12px; }
  main{ padding-bottom:72px; }
}
@media (max-width:400px){
  :root{ --gut:16px; }
  .brand-mark{ font-size:13.5px; letter-spacing:.12em; }
  .searchbox{ font-size:12px; }
}

/* ========================= Scrollbars =======================
   No browser lets a native scrollbar be squared: Chromium rounds the
   thumb, Firefox exposes only a colour, and Windows adds arrow buttons
   on top. So the native bar is hidden outright and a 3px line is drawn
   instead — one fixed element per scrolling container, positioned from
   that container's own geometry by core.js.

   Square ends, no track, no arrows, no fade. It follows the theme
   because it is an ordinary element taking ordinary tokens.
   ============================================================= */

/* 1. hide the native bar everywhere */
html{ scrollbar-width:none; -ms-overflow-style:none; }
*{ scrollbar-width:none; }
::-webkit-scrollbar,
*::-webkit-scrollbar{ width:0; height:0; background:transparent; }
::-webkit-scrollbar-thumb,
*::-webkit-scrollbar-thumb{ background:transparent; }
::-webkit-scrollbar-button,
*::-webkit-scrollbar-button{ display:none; width:0; height:0; }

/* 2. draw our own */
.sbar{
  position:fixed;
  z-index:75;
  background:var(--rule-3);
  background-clip:content-box;      /* paint the content box only */
  border-style:solid;
  border-color:transparent;         /* ...but take pointer events on all of it */
  border-radius:0;
  touch-action:none;
  cursor:default;
  transition:background-color .12s;
}
/* 3px of ink inside a 15px grab strip: the bar stays a hairline and the
   target stays the size of a pointer. */
.sbar-v{ width:15px; border-width:0 6px; }
.sbar-h{ height:15px; border-width:6px 0; }
/* --rule-3 and --ink-4 are almost the same value, so hover steps two
   rungs up the scale — otherwise there is no visible feedback. */
.sbar:hover{ background-color:var(--ink-3); }
.sbar.is-drag{ background-color:var(--ink-2); }

/* A finger does not drag a scrollbar; on touch it is a read-out only. */
@media (pointer:coarse){ .sbar{ pointer-events:none; } }
@media print{ .sbar{ display:none !important; } }

</style>

</div>
<footer class="foot"></footer>

  function searchIndex(q) {
    var idx = GIFU.searchIndex || [];
    q = q.trim().toLowerCase();
    if (!q) return [];
    var out = [];
    for (var i = 0; i < idx.length; i++) {
      var e = idx[i];
      var label = (e.t[GIFU.lang] || e.t.en || "");
      var hay = (label + " " + (e.t.en || "") + " " + (e.j || "")).toLowerCase();
      var pos = hay.indexOf(q);
      if (pos < 0) continue;
      var score = (label.toLowerCase().indexOf(q) === 0 ? 0 : (pos === 0 ? 1 : 2)) * 10
                + (KINDRANK[e.k] == null ? 4 : KINDRANK[e.k]);
      out.push({ e: e, label: label, score: score });
    }
    out.sort(function (a, b) { return a.score - b.score || a.label.length - b.label.length; });
    return out.slice(0, 40);
  }

  function buildSearch() {
    var wrap = el("div", { "class": "searchwrap" });
    var inp = el("input", { type: "search", "class": "searchbox", "aria-label": L(UI.search), autocomplete: "off", spellcheck: "false" });
    inp.setAttribute("placeholder", L(UI.search));
    var panel = el("div", { "class": "results", hidden: "hidden" });
    wrap.appendChild(inp);
    wrap.appendChild(panel);

    var hits = [], sel = -1;

    function close() { panel.hidden = true; sel = -1; }

    function draw() {
      panel.innerHTML = "";
      if (!hits.length) {
        panel.appendChild(el("div", { "class": "r-empty" }, L(UI.noHits)));
        panel.hidden = false;
        return;
      }
      for (var i = 0; i < hits.length; i++) {
        var h = hits[i], e = h.e;
        var href = GIFU.href(e.p, e.a);
        var a = el("a", { href: href, "data-i": String(i) },
          '<span class="r-t">' + h.label +
          (e.j ? '<span class="r-j">' + e.j + "</span>" : "") + "</span>" +
          '<span class="r-p">' + pageLabel(e.p) + " · " + L(KINDLABEL[e.k] || KINDLABEL.row) + "</span>");
        panel.appendChild(a);
      }
      panel.hidden = false;
      mark();
    }

    function mark() {
      var links = panel.querySelectorAll("a");
      for (var i = 0; i < links.length; i++) links[i].classList.toggle("sel", i === sel);
      if (sel >= 0 && links[sel] && links[sel].scrollIntoView) links[sel].scrollIntoView({ block: "nearest" });
    }

    inp.addEventListener("input", function () {
      if (!inp.value.trim()) { close(); return; }
      hits = searchIndex(inp.value);
      sel = hits.length ? 0 : -1;
      draw();
    });

    inp.addEventListener("keydown", function (ev) {
      if (ev.key === "Escape") { inp.value = ""; close(); inp.blur(); return; }
      if (panel.hidden || !hits.length) return;
      if (ev.key === "ArrowDown") { ev.preventDefault(); sel = (sel + 1) % hits.length; mark(); }
      else if (ev.key === "ArrowUp") { ev.preventDefault(); sel = (sel - 1 + hits.length) % hits.length; mark(); }
      else if (ev.key === "Enter") {
        ev.preventDefault();
        var links = panel.querySelectorAll("a");
        if (links[sel]) { close(); inp.blur(); global.location.href = links[sel].getAttribute("href"); }
      }
    });

    inp.addEventListener("blur", function () { setTimeout(close, 160); });
    inp.addEventListener("focus", function () { if (inp.value.trim()) { hits = searchIndex(inp.value); draw(); } });

    return wrap;
  }

  function buildTOC() {
    var toc = document.querySelector(".toc");
    var main = document.querySelector("main");
    if (!toc || !main) return;
    toc.innerHTML = "";
    var heads = main.querySelectorAll("[data-toc]");
    var shell = document.querySelector(".shell");
    if (!heads.length) {
      toc.style.display = "none";
      if (shell) shell.classList.add("no-toc");
      return;
    }
    toc.style.display = "";
    if (shell) shell.classList.remove("no-toc");
    toc.appendChild(el("h5", null, L(UI.contents)));
    var links = [];
    for (var i = 0; i < heads.length; i++) {
      var h = heads[i];
      if (!h.id) h.id = slug(h.textContent) + "-" + i;
      var clone = h.cloneNode(true);
      var jp = clone.querySelectorAll(".h2-jp, .t-jp, .romaji");
      for (var z = 0; z < jp.length; z++) jp[z].parentNode.removeChild(jp[z]);
      var a = el("a", { href: "#" + h.id, "class": h.getAttribute("data-toc") === "3" ? "lvl3" : "" },
        clone.textContent.replace(/\s+/g, " ").trim());
      toc.appendChild(a);
      links.push({ a: a, h: h });
    }
    if (!("IntersectionObserver" in global)) return;
    var seen = {};
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) { seen[e.target.id] = e.isIntersecting; });
      var active = null;
      for (var k = 0; k < links.length; k++) if (seen[links[k].h.id]) { active = links[k]; break; }
      links.forEach(function (l) { l.a.classList.toggle("is-active", l === active); });
    }, { rootMargin: "-70px 0px -72% 0px", threshold: 0 });
    links.forEach(function (l) { io.observe(l.h); });
  }

  /* ---------------------------------------------------------- */
  /* Scrollbars                                                 */
  /*                                                            */
  /* No browser lets a native scrollbar be squared — Chromium    */
  /* rounds the thumb, Firefox exposes only a colour, and        */
  /* Windows adds arrow buttons on top. So base.css hides the    */
  /* native bar and this draws one instead: a 3px line, one      */
  /* fixed element per scrolling container, its geometry taken   */
  /* from that container on every scroll and resize.             */
  /* ---------------------------------------------------------- */
  var SB_W = 3;      /* the ink: a 3px line */
  var SB_HIT = 6;    /* transparent margin each side — the grab strip */
  var SB_GAP = 3;    /* space between the ink and the container edge */
  var SB_PAD = 4;    /* space at each end of the run */
  var SB_MIN = 32;   /* shortest the bar is allowed to get */
  var sbars = [];

  function sbMetrics(c, axis) {
    var doc = c === document.documentElement;
    var r, view, pos, size, total;
    if (doc) {
      r = { top: 0, left: 0, right: global.innerWidth, bottom: global.innerHeight };
      view = axis === "v" ? global.innerHeight : global.innerWidth;
      pos = axis === "v" ? (global.pageYOffset || c.scrollTop) : (global.pageXOffset || c.scrollLeft);
      total = axis === "v" ? c.scrollHeight : c.scrollWidth;
    } else {
      r = c.getBoundingClientRect();
      view = axis === "v" ? c.clientHeight : c.clientWidth;
      pos = axis === "v" ? c.scrollTop : c.scrollLeft;
      total = axis === "v" ? c.scrollHeight : c.scrollWidth;

        zh:"岐阜縣示意圖（非按比例）。縣府規劃所用的五個圈域以區塊表示：北方為飛驒，南方為美濃的四個圈域（西濃、岐阜、中濃、東濃）。飛驒的河川北流入日本海，美濃的河川南流入伊勢灣——這正是自古以「飛山濃水」（飛驒之山、美濃之水）並稱兩地的原因。" },

            d:{en:"Gifu's share of Japan's shipments of Western-style ceramic tableware — Mino ware. For Japanese-style tableware the share is 44.8% (Gifu Prefecture, 2025).",ja:"洋飲食器の全国出荷に占める岐阜県（美濃焼）の割合は71.1%、和飲食器は44.8%（岐阜県、2025年）。",zh:"日本西式陶瓷餐具出貨量中岐阜縣（美濃燒）占 71.1%，和式餐具占 44.8%（岐阜縣，2025 年）。"} },

        ] },
        { t:"p", text:{
          en:"Two more numbers are worth carrying. The <strong>population centre of Japan</strong> — the point on which the country's people would balance — has fallen inside the city of Seki at every census since 2000; in 2020 it lay in the hills of Nakanoho. And the city of <strong>Takayama</strong>, at 2,178 km², is the largest municipality in Japan by area, almost the size of the whole of Tokyo Metropolis.",
          ja:"あと二つ、覚えておきたい数字がある。国民一人ひとりが同じ重さを持つとして日本の人口が釣り合う点——<strong>人口重心</strong>——は、2000年以降の国勢調査で毎回関市内に落ちており、2020年には中之保の山あいにあった。そして<strong>高山市</strong>は面積2,178平方キロで、市町村としては日本最大、東京都全体にほぼ匹敵する。",
          zh:"還有兩個數字值得記住。<strong>日本的人口重心</strong>——假設每個人重量相同時全國人口的平衡點——自 2000 年起每次國勢調查都落在關市境內，2020 年位於中之保的山間。而<strong>高山市</strong>面積 2,178 平方公里，是日本面積最大的市町村，幾乎與整個東京都相當。" } },
        { t:"note", label:{en:"On the numbers",ja:"数字について",zh:"關於數字"}, text:{
          en:"Every figure in this book carries its year and its source. Statistics move — population falls every year, shipment values follow the economy — so where a number matters the date matters with it. The sources are listed on the <a href=\"sources.html\">Sources</a> page, government and primary sources first.",
          ja:"本書の数値には、すべて年と出典を付した。統計は動く——人口は毎年減り、出荷額は景気に従う——ゆえに、数字が意味を持つところでは日付も同じだけ意味を持つ。出典は<a href=\"sources.html\">出典</a>の頁に、公的・一次資料を先にして掲げる。",
          zh:"本書的每一個數字都附有年份與出處。統計會變動——人口逐年減少，出貨額隨景氣起伏——因此凡數字重要之處，日期同樣重要。出處列於<a href=\"sources.html\">資料來源</a>頁，官方與一手資料列在前面。" } }

    { t:"section", id:"two",
      title:{ en:"Two provinces, one prefecture", ja:"二つの国、一つの県", zh:"兩個國，一個縣" }, jp:"美濃と飛騨",
      body:[
        { t:"p", text:{
          en:"Gifu Prefecture took its present shape in 1876, when the former province of Hida was joined to the prefecture that had been formed from Mino. The two had almost nothing in common except a border. Mino was a province of rice, rivers and roads, crossed by the Nakasendō and fought over by every power that wanted to hold central Japan. Hida was a mountain province so short of paddy land that, under the eighth-century legal codes, it paid its taxes in carpenters.",
          ja:"岐阜県が今の形になったのは1876年（明治9年）、美濃から成った県に旧飛騨国が合わさったときである。両者には、境を接していること以外ほとんど共通点がなかった。美濃は米と川と道の国で、中山道が貫き、日本の中央を握ろうとする勢力が代々争った土地である。飛騨は水田に乏しい山国で、八世紀の律令のもとでは、税を大工で納めた。",
          zh:"岐阜縣於 1876 年（明治 9 年）成為今日的樣貌：舊飛驒國併入由美濃組成的縣。兩者除了邊界相接，幾乎沒有共同點。美濃是米、河川與道路之國，中山道貫穿其間，凡欲掌握日本中央的勢力無不爭奪此地。飛驒則是水田稀少的山國，在八世紀的律令之下，是以木匠來繳稅的。" } },
        { t:"compare", cols:2, items:[
          { title:{en:"Mino",ja:"美濃",zh:"美濃"}, jp:"みの · 濃州",
            text:{
              en:"The southern three-fifths of the prefecture and nine-tenths of its people. The Nōbi Plain and the lower reaches of the Kiso, Nagara and Ibi; castle towns, river ports and the sixteen Mino post towns of the Nakasendō. Its crafts are the crafts of a trading country: paper at Mino, pottery at Tajimi and Toki, blades at Seki, umbrellas and lanterns in Gifu city. In the Edo period it was divided among many small domains and a patchwork of shogunal and bannermen's lands.",
              ja:"県の南側五分の三を占め、県民の九割が住む。濃尾平野と木曽・長良・揖斐の下流域、城下町と川湊、そして中山道の美濃十六宿。その工芸は交易の国のものである——美濃の紙、多治見・土岐の焼き物、関の刃物、岐阜の和傘と提灯。江戸時代には多くの小藩と、幕府領・旗本領が入り組む土地であった。",
              zh:"占全縣南側五分之三、居住著九成縣民。濃尾平原與木曾、長良、揖斐三川的下游，城下町、河港，以及中山道上的美濃十六宿。其工藝是交易之國的工藝：美濃的紙、多治見與土岐的陶器、關的刀刃、岐阜市的和傘與燈籠。江戶時代，這裡分屬眾多小藩，加上幕府領與旗本領交錯其間。" } },
          { title:{en:"Hida",ja:"飛騨",zh:"飛驒"}, jp:"ひだ · 飛州",
            text:{
              en:"The northern two-fifths of the land and well under a tenth of the people. A high basin ringed by peaks over 3,000 metres, whose rivers — the Miya, the Takahara, the Shō — flow north to the Sea of Japan. Timber, mines and carpentry rather than rice. From 1692 the shogunate ruled it directly from the Takayama Jinya, and its merchant town, its festival floats and its furniture industry all descend from that long, quiet wealth.",
              ja:"県土の北側五分の二を占めるが、人口は一割にはるかに満たない。三千メートル級の山々に囲まれた高い盆地で、宮川・高原川・庄川はいずれも北へ流れて日本海に注ぐ。米ではなく、木と鉱山と大工の国である。1692年（元禄5年）からは幕府が高山陣屋を通じて直轄し、商人の町並みも祭りの屋台も家具産業も、その長く静かな富から生まれた。",
              zh:"占全縣土地北側五分之二，人口卻遠不及一成。被三千公尺級群山環繞的高地盆地，宮川、高原川、庄川皆北流注入日本海。這裡不以稻米、而以木材、礦山與木匠為生。自 1692 年（元祿 5 年）起由幕府透過高山陣屋直轄，商人町並、祭典屋台與家具產業，皆源自那段悠長而安靜的富庶。" } }
        ] },
        { t:"p", text:{
          en:"The pairing survives in a four-character phrase the prefecture still uses: <strong>飛山濃水</strong>, <em>hisan nōsui</em> — the mountains of Hida, the waters of Mino. Most of what follows in this book can be read as a consequence of one or the other.",
          ja:"この対は、県がいまも用いる四字の言葉に残っている——<strong>飛山濃水</strong>、飛騨の山と美濃の水。本書で以下に述べることの大半は、そのどちらかの帰結として読むことができる。",
          zh:"這組對照保留在縣府至今仍在使用的四字詞裡：<strong>飛山濃水</strong>——飛驒之山，美濃之水。本書以下所述，大半都可以讀作其中之一的結果。" } }
      ]
    },

    { t:"section", id:"read",
      title:{ en:"How to read this book", ja:"本書の読み方", zh:"如何閱讀本書" }, jp:"凡例",
      body:[
        { t:"ul", plain:true, items:[
          { en:"<strong>Three languages, written together.</strong> The English, Japanese and Chinese texts are written side by side rather than translated one from another. Switch at any time from the menu; nothing reloads, and your choice is remembered.",
            ja:"<strong>三つの言葉は並べて書いた。</strong>英語・日本語・中国語の本文は、一方から他方へ訳したのではなく、並行して書いている。メニューからいつでも切り替えられ、再読み込みはなく、選択は記憶される。",
            zh:"<strong>三種語言並行撰寫。</strong>英文、日文與中文並非由一種翻譯成另一種，而是並排寫成。可隨時從選單切換，頁面不會重新載入，選擇也會被記住。" },
          { en:"<strong>Names.</strong> Japanese names are given family name first. Long vowels are marked in English (Tōnō, Chūnō, Ōgaki) except in names with an established spelling (Gifu, Hida). Chinese text uses traditional forms, so 飛騨 is written 飛驒 and 関 is written 關.",
            ja:"<strong>人名と地名。</strong>日本人の名は姓・名の順とする。英文では長音を示す（Tōnō、Chūnō、Ōgaki）。ただし定着した綴り（Gifu、Hida）は除く。中国語文は繁体字を用い、飛騨は飛驒、関は關と書く。",
            zh:"<strong>人名與地名。</strong>日本人名採姓在前、名在後。英文標示長音（Tōnō、Chūnō、Ōgaki），已有固定拼法者（Gifu、Hida）除外。中文採繁體字，故「飛騨」寫作「飛驒」，「関」寫作「關」。" },
          { en:"<strong>Numbers carry their year and their unit</strong>, or they are not used. Where sources disagree — several dates in Gifu's history are disputed — the disagreement is stated rather than resolved.",
            ja:"<strong>数値には年と単位を付す</strong>。付せないものは用いない。資料が食い違う場合——岐阜の歴史にはそうした日付がいくつもある——は、一方に決めずに食い違いをそのまま記す。",
            zh:"<strong>數字必附年份與單位</strong>，否則不用。資料之間有出入時——岐阜史上有好幾個這樣的年代——照實陳述分歧，而不強作裁斷。" },
          { en:"<strong>Every diagram is drawn, not photographed</strong>, and redrawn in the language you are reading. Diagrams that show proportions only roughly say so on their face.",
            ja:"<strong>図はすべて写真ではなく描いたもので</strong>、読んでいる言語で描き直される。比率を概略でしか示さない図は、そのことを図中に明記する。",
            zh:"<strong>所有圖表皆為繪製而非照片</strong>，並會以你正在閱讀的語言重新繪出。僅呈現大致比例的示意圖，會在圖上註明。" },
          { en:"<strong>Search</strong> from the box at the top, or press <kbd>/</kbd> anywhere. Every page, section, table row, glossary term and directory entry is indexed in all three languages.",
            ja:"<strong>検索</strong>は上部の欄から、またはどこでも <kbd>/</kbd> キーで。すべての頁・節・表の行・用語・名鑑の項目が、三言語で索引されている。",
            zh:"<strong>搜尋</strong>可使用頂端的欄位，或在任何地方按 <kbd>/</kbd>。所有頁面、章節、表格列、詞彙與名鑑條目，皆以三種語言建立索引。" }
        ] }
      ]
    },

            text:{ en:"Start with <a href=\"forests.html\">The Forests</a> for the scale of it — four-fifths of the land — then <a href=\"hinoki.html\">Hinoki</a> for the tree that built Ise's shrines, <a href=\"takumi.html\">Hida no Takumi</a> for the carpenters who paid their taxes in labour, <a href=\"furniture.html\">Hida Furniture</a> for what their descendants make now, and <a href=\"guitars.html\">Hand-made Guitars</a> for the most unexpected thing Gifu's wood has become.",

            text:{ en:"<a href=\"regions.html\">Five Regions</a> gives the shape of the prefecture town by town. <a href=\"towns.html\">Old Towns</a>, <a href=\"festivals.html\">Festivals &amp; Floats</a> and <a href=\"ukai.html\">Cormorant Fishing</a> tell you what to see and when; <a href=\"journeys.html\">Five Journeys</a> strings them into routes.",
                   ja:"<a href=\"regions.html\">五つの圏域</a>で県の形を町ごとにつかむ。<a href=\"towns.html\">町並み</a>、<a href=\"festivals.html\">祭りと屋台</a>、<a href=\"ukai.html\">鵜飼</a>は、何をいつ見るかを教える。<a href=\"journeys.html\">五つの旅</a>はそれらを道筋につなぐ。",
                   zh:"<a href=\"regions.html\">五大圈域</a>逐鎮勾勒縣的樣貌。<a href=\"towns.html\">老街町並</a>、<a href=\"festivals.html\">祭典與屋台</a>與<a href=\"ukai.html\">鵜飼</a>告訴你看什麼、何時看；<a href=\"journeys.html\">五段旅程</a>則把它們串成路線。" } },
          { title:{en:"If you came for history",ja:"歴史に惹かれて来たなら",zh:"若你為歷史而來"}, jp:"史",
            text:{ en:"<a href=\"provinces.html\">Mino and Hida</a> explains why the prefecture has two personalities. <a href=\"nobunaga.html\">Nobunaga's Gifu</a> and <a href=\"sekigahara.html\">Sekigahara</a> are the two moments when all of Japan turned on this ground; <a href=\"chisui.html\">Taming the Three Rivers</a> is the longer, quieter story that shaped more lives than either.",
                   ja:"<a href=\"provinces.html\">美濃と飛騨</a>は、県が二つの顔を持つ理由を説く。<a href=\"nobunaga.html\">信長の岐阜</a>と<a href=\"sekigahara.html\">関ヶ原</a>は、日本全体がこの地で向きを変えた二つの瞬間である。<a href=\"chisui.html\">木曽三川の治水</a>は、そのどちらよりも多くの暮らしを形づくった、長く静かな物語である。",
                   zh:"<a href=\"provinces.html\">美濃與飛驒</a>說明本縣為何有兩種性格。<a href=\"nobunaga.html\">信長的岐阜</a>與<a href=\"sekigahara.html\">關原</a>，是全日本在這片土地上轉向的兩個時刻；<a href=\"chisui.html\">木曾三川的治水</a>則是一段更長、更安靜的故事，它形塑的生命比前兩者都多。" } }
        ] }
      ]
    },

    { t:"section", id:"six",
      title:{ en:"Six things to do with your own hands", ja:"自分の手で確かめる六つのこと", zh:"用自己的手去做的六件事" }, jp:"体験",
      body:[
        { t:"p", text:{
          en:"None of these needs special access, and each one connects a page of this book to something you can smell, hold or taste. They are listed roughly from spring to winter.",
          ja:"どれも特別な伝手を要さず、いずれも本書の一頁を、嗅ぎ、手に取り、味わえる何かに結びつける。おおむね春から冬の順に並べた。",
          zh:"這些都不需要特殊門路，每一件都把本書的某一頁，連結到你能聞、能握、能嚐的東西。大致依春到冬的順序排列。" } },
        { t:"ol", items:[
          { en:"<strong>Wash your hands at Sōgi-sui</strong> in Gujō-Hachiman, the first spring on the national list of a hundred famous waters. Then walk the town's channels and notice how much of daily life is arranged around running water. — <a href=\"rivers.html\">Rivers &amp; Water</a>",
            ja:"<strong>郡上八幡の宗祇水で手を洗う。</strong>名水百選の第一号に選ばれた湧水である。そのあと町の水路を歩き、日々の暮らしがどれほど流れる水を中心に組み立てられているかを見る。——<a href=\"rivers.html\">川と水</a>",
            zh:"<strong>在郡上八幡的宗祇水洗手。</strong>這是「名水百選」選出的第一號湧泉。然後沿著鎮上的水道散步，留意日常生活有多少是圍繞著流水安排的。——<a href=\"rivers.html\">河川與水</a>" },
          { en:"<strong>Watch a cormorant boat at night</strong> on the Nagara in Gifu city, between 11 May and 15 October. Six fishermen here, and three more at Oze in Seki, hold the title of cormorant master of the Imperial Household Agency. — <a href=\"ukai.html\">Cormorant Fishing</a>",
            ja:"<strong>夜の長良川で鵜舟を見る。</strong>岐阜市で5月11日から10月15日まで。ここの鵜匠六人と、関市小瀬の三人が、宮内庁式部職鵜匠の職名を持つ。——<a href=\"ukai.html\">鵜飼</a>",
            zh:"<strong>在夜晚的長良川看鵜舟。</strong>岐阜市每年 5 月 11 日至 10 月 15 日舉行。這裡的六位鵜匠，加上關市小瀨的三位，擁有「宮內廳式部職鵜匠」的職銜。——<a href=\"ukai.html\">鵜飼</a>" },
          { en:"<strong>Put your nose to a hinoki board</strong> — in a lumber yard in Tōnō, a bath in Gero, or a new masu cup from Ōgaki. The smell is the reason hinoki has been the timber of shrines for thirteen centuries. — <a href=\"hinoki.html\">Hinoki</a>",
            ja:"<strong>檜の板に鼻を寄せる。</strong>東濃の製材所でも、下呂の風呂でも、大垣の新しい枡でもよい。千三百年にわたり檜が社の木であり続けた理由は、その香りにある。——<a href=\"hinoki.html\">檜</a>",
            zh:"<strong>把鼻子湊近一塊檜木板。</strong>在東濃的製材所、下呂的浴池，或大垣的新木枡都可以。檜木一千三百年來一直是神社之木，原因就在那香氣裡。——<a href=\"hinoki.html\">檜木</a>" },
          { en:"<strong>Hold a Seki knife and look at the edge</strong> under light. Then visit the swordsmiths' hall in Seki on a demonstration day, when a traditional forging is shown in public, and see where that edge came from. — <a href=\"seki.html\">Seki</a>",
            ja:"<strong>関の包丁を手に取り、光にかざして刃先を見る。</strong>そして関の鍛冶伝承館で古式日本刀鍛錬が公開される日に訪れ、その刃がどこから来たのかを見る。——<a href=\"seki.html\">刃物のまち・関</a>",
            zh:"<strong>拿起一把關市的菜刀，對著光看刀刃。</strong>再挑一個關鍛冶傳承館公開古式日本刀鍛鍊的日子造訪，看看那道刃口從何而來。——<a href=\"seki.html\">刀刃之城・關</a>" },
          { en:"<strong>Sit in a Hida chair</strong> — in a showroom in Takayama, or anywhere one is in use — and turn it over. The joinery underneath is the direct descendant of the carpentry that built Nara. — <a href=\"furniture.html\">Hida Furniture</a>",
            ja:"<strong>飛騨の椅子に座り、裏返してみる。</strong>高山のショールームでも、使われているどこででもよい。裏側の組み手は、奈良の都を建てた大工仕事の直系の子孫である。——<a href=\"furniture.html\">飛騨の家具</a>",
            zh:"<strong>坐上一張飛驒椅子，再把它翻過來看。</strong>在高山的展示間，或任何正在使用它的地方皆可。底下的接合工法，是建造奈良都城的木工直系後裔。——<a href=\"furniture.html\">飛驒家具</a>" },
          { en:"<strong>Drink new sake in Takayama in winter</strong>, when the cedar balls hang green over the brewery doors to say that this season's sake is pressed. The cold outside is the same cold that made it. — <a href=\"hidasake.html\">Brewing in Hida</a>",
            ja:"<strong>冬の高山で新酒を飲む。</strong>蔵の軒先に青い杉玉が吊るされ、今季の酒が搾られたことを告げる季節である。外の寒さは、その酒を造った寒さと同じものだ。——<a href=\"hidasake.html\">飛騨の酒造り</a>",
            zh:"<strong>冬天在高山喝新酒。</strong>那時酒藏門簷掛上青綠的杉玉，告訴人們本季的酒已經榨好。外頭的寒冷，正是造出這酒的那股寒冷。——<a href=\"hidasake.html\">飛驒的釀酒</a>" }
        ] },
        { t:"note", label:{en:"Seasons and dates",ja:"季節と日付",zh:"季節與日期"}, text:{
          en:"Dates and demonstration days change from year to year and are set by the organisers; the pages linked above give the pattern, and the organisers' own announcements give the current year.",
          ja:"日程や公開日は年ごとに変わり、主催者が定める。上の各頁は例年の型を示すもので、その年の日取りは主催者の告知で確かめられたい。",
          zh:"日期與公開日每年不同，由主辦單位訂定。上面連結的各頁說明的是慣例，當年的日期請以主辦單位的公告為準。" } }
      ]
    },

  jp: "伐る · 組む · 鍛える · 漉く · 焼く · 醸す",
  lede: {
    en: "“Spirit” is a word that invites vagueness. This page tries to pin it down. Most of what Gifu is known for — its carpenters, its blades, its paper, its pottery and its sake — can be described with six verbs of making, each one tied to something the land supplies. Read together, they describe a people whose character was formed less by what they believed than by what they did with timber, iron, fibre, clay, rice and cold.",
    ja: "「魂」は曖昧さを招く言葉である。この頁では、それを具体的に押さえてみたい。岐阜が知られるものの大半——大工、刃物、紙、焼き物、酒——は、ものを作る六つの動詞で言い表すことができ、そのどれもが土地の与える何かと結びついている。六つを並べて読むと、信じたことよりも、木と鉄と繊維と土と米と寒さを相手に何をしたかによって気質を形づくられた人々の姿が見えてくる。",
    zh: "「魂」是一個容易流於含糊的字。本頁試著把它說清楚。岐阜為人所知的大多數東西——木匠、刀刃、紙、陶器與酒——都可以用六個「造物」的動詞來描述，而每一個都與這片土地所供給的某樣東西相連。把它們放在一起讀，會看見一群人：塑造他們性格的，與其說是他們相信什麼，不如說是他們如何對待木材、鐵、纖維、黏土、稻米與寒冷。"

    { t:"section", id:"six",
      title:{ en:"Six verbs", ja:"六つの動詞", zh:"六個動詞" }, jp:"六字",

        { t:"grid", cols:3, cells:[
          { k:{en:"kiru · to fell",ja:"きる",zh:"伐"}, v:"伐る", h:{en:"The forest",ja:"森",zh:"森林"},
            d:{en:"Four-fifths of the prefecture is forest, and the hinoki of Ura-Kiso and Tōnō has been cut for shrines and castles since the Middle Ages. Felling is where every other craft begins: charcoal for the smith, fuel for the kiln, casks and vats for the brewer.",
               ja:"県土の五分の四は森であり、裏木曽と東濃の檜は中世以来、社や城のために伐られてきた。伐ることは、ほかのすべての工芸の始まりである——鍛冶の炭、窯の薪、酒屋の桶と樽。",
               zh:"全縣五分之四是森林，裏木曾與東濃的檜木自中世以來便為神社與城郭而伐。伐木是其他一切工藝的起點：鍛冶的木炭、窯的燃料、釀酒的木桶與酒槽。"} },
          { k:{en:"kumu · to join",ja:"くむ",zh:"組"}, v:"組む", h:{en:"The carpenter",ja:"大工",zh:"木匠"},
            d:{en:"Hida's carpenters were sent to build the capitals of the eighth century in place of taxes. What they carried was joinery — timber locked to timber without nails — and it runs unbroken from temple halls to Takayama's festival floats and the chairs made there today.",
               ja:"飛騨の大工は八世紀、税の代わりに都の造営へ送られた。彼らが携えたのは継手・仕口——釘を用いず木と木を組み合わせる技——であり、それは寺の堂から高山の祭屋台、今日そこで作られる椅子まで途切れずに続く。",
               zh:"八世紀時，飛驒的木匠以勞役代替租稅，被派去營建都城。他們帶去的是榫卯——不用釘子、讓木與木互相咬合的技術——從寺院殿堂到高山的祭典屋台，再到今日當地製作的椅子，一脈相承。"} },
          { k:{en:"kitaeru · to forge",ja:"きたえる",zh:"鍛"}, v:"鍛える", h:{en:"The smith",ja:"鍛冶",zh:"鍛冶"},
            d:{en:"Seki had iron, pine charcoal, good water and clay for the tempering coat, and from the fourteenth century it had swordsmiths. The Mino tradition was prized for blades that would neither break nor bend; when the swords were banned, the smiths turned to knives.",
               ja:"関には鉄と松炭と良い水、焼刃土に使う粘土があり、十四世紀には刀鍛冶がいた。美濃伝は「折れず曲がらず」の刃で重んじられた。帯刀が禁じられると、鍛冶たちは包丁へ向かった。",
               zh:"關市有鐵、松炭、好水，以及燒刃時塗抹的黏土；十四世紀起便有刀匠。美濃傳以「不折不彎」的刀身見重於世；禁刀令頒布後，匠人們轉而打造菜刀。"} },
          { k:{en:"suku · to lay paper",ja:"すく",zh:"漉"}, v:"漉く", h:{en:"The papermaker",ja:"紙漉き",zh:"造紙匠"},
            d:{en:"Mino paper is recorded from the early eighth century and was the shōji paper of choice in Edo. It needs paper-mulberry fibre, very clean cold water and patience; the Nagara and its tributaries supplied the water, and the river carried the paper out.",
               ja:"美濃紙は八世紀初めから記録に現れ、江戸では障子紙の筆頭であった。必要なのは楮の繊維と、きわめて清らかな冷たい水と、根気である。長良川とその支流が水を与え、同じ川が紙を運び出した。",
               zh:"美濃紙自八世紀初即見於記載，在江戶是紙拉門用紙的首選。它需要楮樹纖維、極潔淨的冷水與耐心；長良川及其支流供給了水，也把紙運了出去。"} },
          { k:{en:"yaku · to fire",ja:"やく",zh:"燒"}, v:"焼く", h:{en:"The potter",ja:"陶工",zh:"陶工"},
            d:{en:"The clays of Tōnō gave Japan the tea wares of the late sixteenth century — Shino, Oribe, Yellow Seto — and give it most of its everyday tableware now. Firing needed fuel, which the forests supplied until coal and gas replaced them.",
               ja:"東濃の粘土は、十六世紀末の日本に志野・織部・黄瀬戸といった茶の器をもたらし、いまは日常の食器の大半をもたらしている。焼くには燃料が要り、石炭とガスに替わるまでは森がそれを供した。",
               zh:"東濃的黏土在十六世紀末為日本帶來了志野、織部、黃瀨戶等茶器，如今則供應日本大部分的日常餐具。燒窯需要燃料，在煤與瓦斯取而代之以前，一直由森林提供。"} },
          { k:{en:"kamosu · to brew",ja:"かもす",zh:"釀"}, v:"醸す", h:{en:"The brewer",ja:"醸造家",zh:"釀酒人"},
            d:{en:"Around fifty breweries work along the rivers of Mino and in the cold basins of Hida. Brewing is a winter craft: it needs rice, soft water and steady cold, and Hida has had more of the last than almost anywhere in central Japan.",
               ja:"美濃の川沿いと飛騨の寒い盆地に、五十ほどの蔵がある。酒造りは冬の仕事で、米と軟らかな水と安定した寒さを要する。最後の一つについて、飛騨は本州中部で指折りの恵まれた土地である。",
               zh:"約五十家酒藏分布在美濃的河畔與飛驒寒冷的盆地。釀酒是冬季的工藝：需要稻米、軟水與穩定的寒冷；而論寒冷，飛驒在本州中部幾乎無處可及。"} }
        ] }
      ]
    },

    { t:"section", id:"yui",
      title:{ en:"And one noun: yui", ja:"そして一つの名詞——結", zh:"再加一個名詞：結" }, jp:"結",
      body:[
        { t:"p", text:{
          en:"Every one of the six verbs is, in practice, done by a group. The word Gifu uses for that is <strong>結</strong>, <em>yui</em>: the reciprocal labour by which a village re-thatches one house in a day and then moves on to the next. It is most visible in Shirakawa-gō, where a steep gasshō roof still takes a crowd of neighbours to renew, but the same logic organised the ring-levee villages of the lower rivers, which had to maintain one embankment together or drown separately, and the festival neighbourhoods of Takayama, each of which keeps one float.",
          ja:"六つの動詞は、実際にはいずれも集団で行われる。岐阜でそれを指す言葉が<strong>結</strong>である。一日で一軒の屋根を葺き替え、次の家へ移っていく、村の互いの労力の貸し借り。白川郷では、急勾配の合掌屋根の葺き替えにいまも大勢の近隣が集まるので最もよく見える。だが同じ論理は、一本の堤をともに守るか、ばらばらに水に沈むかしかなかった下流の輪中の村々をも、屋台を一台ずつ守る高山の祭りの町内をも組み立ててきた。",
          zh:"這六個動詞，實際上都是由一群人完成的。岐阜用來指稱這件事的字是<strong>結</strong>（yui）：村人彼此出工相助，一天之內把一戶人家的屋頂重新葺好，再移到下一戶。在白川鄉最為顯眼——陡峭的合掌屋頂至今仍需一大群鄰居才能翻新；但同樣的邏輯也組織了下游的輪中村落——他們只能一起維護一道堤防，否則就各自被淹沒——也組織了高山的祭典町內，每個町內守護一台屋台。" } },
        { t:"quote",
          text:{ en:"“Hida no takumi” — the craftsman of Hida — was already a proverb for skill in the Heian court. The phrase has outlived the tax system that produced it by more than a thousand years.",
                 ja:"「飛騨の匠」は、平安の宮廷ですでに巧みさの代名詞であった。この言葉は、それを生んだ税の制度より千年以上長く生きている。",
                 zh:"「飛驒工匠」在平安朝廷裡便已是技藝精湛的代名詞。這個詞，比催生它的稅制多活了一千多年。" },
          cite:{ en:"See Hida no Takumi", ja:"「飛騨の匠」の頁を参照", zh:"見「飛驒工匠」頁" } }
      ]
    },

    { t:"section", id:"not",
      title:{ en:"What the word does not mean", ja:"この言葉が意味しないこと", zh:"這個字不代表什麼" }, jp:"注意",
      body:[
        { t:"p", text:{
          en:"It would be easy to turn six verbs into a story about timeless artisans. The record does not support that. Every craft on this page has been, at some point, an industry under pressure: Mino paper lost most of its makers to machine paper in the twentieth century; the Seki smiths lost their market overnight in 1876; Hida's modern furniture industry was founded in 1920 on a borrowed Western bentwood technique; Mino ware lives or dies by export prices. What persists is not a mystique but a set of skills, a set of resources, and a habit of adapting one to the other.",
          ja:"六つの動詞を、時を超えた職人の物語に仕立てるのはたやすい。だが記録はそれを支持しない。この頁の工芸はどれも、いずれかの時点で圧迫を受ける産業であった。美濃紙は二十世紀に機械漉きの紙に押されて漉き手の大半を失い、関の鍛冶は1876年に一夜で市場を失い、飛騨の近代家具産業は1920年、西洋から借りた曲木の技術のうえに興され、美濃焼は輸出価格とともに浮き沈みする。続いてきたのは神秘ではなく、技の束と資源の束、そして一方を他方に合わせていく習いである。",
          zh:"把六個動詞寫成一則關於永恆匠人的故事並不難，但史料並不支持這種說法。本頁的每一項工藝，都曾在某個時期是承受壓力的產業：美濃紙在二十世紀因機器造紙而失去大部分紙匠；關的鍛冶在 1876 年一夜之間失去市場；飛驒的近代家具產業則是在 1920 年借用西方曲木技術才得以創立；美濃燒則隨出口價格浮沉。延續下來的不是神秘感，而是一套技藝、一組資源，以及讓前者適應後者的習慣。" } },
        { t:"note", label:{en:"A test",ja:"一つの試金石",zh:"一個檢驗"}, text:{
          en:"When a page in this book uses a word like “spirit”, “tradition” or “takumi”, it should be possible to point to a document, a date or a technique behind it. Where that is not possible, the page says so.",
          ja:"本書のある頁が「魂」「伝統」「匠」のような言葉を使うとき、その背後にある文書・日付・技法を指し示せなければならない。示せない場合は、頁のうえでそう断る。",
          zh:"本書任何一頁使用「魂」、「傳統」或「匠」這類字眼時，都應能指出其背後的文獻、日期或技法。若無法指出，頁面上會如實說明。" } }
      ]
    },

    { t:"related", items:[

      { href:"takumi.html", why:{ en:"The second verb, and where the proverb came from.", ja:"二つ目の動詞と、その言葉の出どころ。", zh:"第二個動詞，以及那句俗語的來歷。" } },

      { href:"shirakawago.html", why:{ en:"Yui, on a roof, in a single day.", ja:"一日の屋根の上の「結」。", zh:"一天之內、屋頂上的「結」。" } }
    ] }
  ]

  lede: {
    en: "Few Japanese prefectures carry a name chosen for a political programme. Gifu does: the story is that Oda Nobunaga renamed the town below his new castle in 1567 after the mountain from which an ancient Chinese dynasty had set out to unify its world. The story is partly true. This page sets out what the names Gifu, Mino and Hida mean, where they come from, and which parts of the familiar accounts rest on documents and which on later retelling.",
    ja: "政治的な意図のもとに選ばれた名を持つ県は多くない。岐阜はその一つである。1567年、織田信長が新たな居城の城下を、古代中国の王朝が天下統一へと起った山にちなんで改名した——そう語られてきた。この話は半ば正しい。本頁では岐阜・美濃・飛騨という名が何を意味し、どこから来たのか、そして広く知られた説明のどこが史料に拠り、どこが後の語り直しに拠るのかを示す。",
    zh: "以政治綱領為名的日本縣並不多，岐阜是其中之一：據說 1567 年，織田信長把新城下的城鎮，改名為一座山的名字——古代中國某個王朝正是從那座山出發、統一天下的。這個故事只對了一半。本頁說明岐阜、美濃、飛驒這幾個名字的意思與來歷，以及那些耳熟能詳的說法中，哪些根據史料、哪些出自後人的轉述。"

        ja:"二つの文字。「岐」は周の文王が興った山、岐山の岐。「阜」は丘・盛り土を意味し、孔子の生地、曲阜の阜である。二字の組み合わせは「天下を治める起点となる地」と読まれるのが通例で、この解釈は禅僧・沢彦宗恩に帰せられる。",

    { t:"section", id:"gifu",
      title:{ en:"Gifu: a name for a conqueror", ja:"岐阜——征服者のための名", zh:"岐阜——為征服者而取的名" }, jp:"信長と沢彦",
      body:[
        { t:"p", text:{
          en:"In the autumn of 1567 (Eiroku 10) Oda Nobunaga took Inabayama Castle from the Saitō and moved his seat there from Komaki in Owari. The town at the foot of the mountain had been called Inokuchi (井口). According to the account that has become standard, Nobunaga asked Takugen Sōon, a Rinzai monk of Seishū-ji in Owari who had once been his tutor, for a new name; Takugen offered three — <em>Gizan</em> (岐山), <em>Giyō</em> (岐陽) and <em>Gifu</em> (岐阜) — and Nobunaga chose the last.",
          ja:"1567年（永禄10年）秋、織田信長は斎藤氏から稲葉山城を奪い、尾張の小牧から居を移した。山麓の町は井口（いのくち）と呼ばれていた。定説となった話によれば、信長はかつての師で尾張・政秀寺の臨済僧、沢彦宗恩に新しい名を求め、沢彦は「岐山」「岐陽」「岐阜」の三つを示し、信長は最後のものを選んだ。",
          zh:"1567 年（永祿 10 年）秋，織田信長從齋藤氏手中奪下稻葉山城，並將居城從尾張的小牧遷到此地。山腳下的城鎮原名井口（いのくち）。依已成定說的記載，信長請曾任其師的尾張政秀寺臨濟宗僧人澤彥宗恩另取新名；澤彥提出「岐山」、「岐陽」、「岐阜」三個候選，信長選了最後一個。" } },
        { t:"p", text:{
          en:"The allusion was to the Zhou dynasty. In the Chinese tradition King Wen rose from Mount Qi and his son founded the dynasty that settled the realm; to name a town Gifu was to announce a similar intention. In the same year Nobunaga began to use a vermilion seal reading <strong>天下布武</strong>, <em>tenka fubu</em> — usually rendered “to spread martial rule across the realm”, though some historians read <em>tenka</em> here as the home provinces around Kyoto rather than all of Japan. Takugen is also credited with that phrase.",
          ja:"典拠は周王朝である。中国の伝承では、文王が岐山より起こり、その子が天下を定める王朝を開いた。町を岐阜と名づけることは、同じ志を掲げることであった。同じ年から信長は「<strong>天下布武</strong>」の朱印を用い始める。「武をもって天下に号令する」と訳されるのが普通だが、ここでの「天下」を日本全国ではなく京都を中心とする畿内とみる研究者もいる。この文言もまた沢彦の案とされる。",
          zh:"典故出自周朝。依中國傳統說法，周文王起於岐山，其子建立了平定天下的王朝；把城鎮命名為岐阜，等於宣告同樣的志向。同一年，信長開始使用印文為「<strong>天下布武</strong>」的朱印——通常譯為「以武力號令天下」，但也有學者認為此處的「天下」指的是以京都為中心的畿內，而非整個日本。這四個字同樣被歸功於澤彥。" } },
        { t:"note", label:{en:"What the documents show",ja:"史料が示すこと",zh:"史料所示"}, text:{
          en:"The name was not invented in 1567. Zen monks in Mino were already using <em>Giyō</em> and <em>Gifu</em> as literary names for the district decades earlier — the forms appear in the late-fifteenth-century collection <em>Baika mujinzō</em> of the monk-poet Banri Shūku and in the <em>Jinshū-roku</em>. What Nobunaga did was adopt a name current among the learned and make it the official name of his castle and town. The three-candidate story first appears in later sources and is best treated as tradition.",
          ja:"この名は1567年に発明されたのではない。美濃の禅僧たちは、それより何十年も前から、この地の雅名として「岐陽」「岐阜」を用いていた。十五世紀末の詩僧・万里集九の『梅花無尽蔵』や『仁岫録』にその形が見える。信長がしたのは、学識ある人々のあいだで通じていた名を採り、自らの城と町の正式な名にしたことである。三案から選んだという話は後代の史料に初めて現れ、伝承として扱うのが妥当である。",
          zh:"這個名字並非 1567 年才發明。早在數十年前，美濃的禪僧便已把「岐陽」、「岐阜」當作此地的雅稱——十五世紀末詩僧萬里集九的《梅花無盡藏》與《仁岫錄》中都可見到。信長所做的，是採用一個在知識階層間已通行的名稱，並將之定為自己城池與城鎮的正式名稱。「三選一」的故事首見於較晚的史料，宜視為傳說。" } },
        { t:"timeline", items:[
          { year:"late 15th c.", era:{en:"Muromachi",ja:"室町",zh:"室町"}, title:{en:"Giyō and Gifu in monks' writing",ja:"禅僧の詩文に岐陽・岐阜",zh:"禪僧詩文中的岐陽與岐阜"},
            text:{en:"Literary names for the Inokuchi district appear in the works of Zen monks in Mino.",ja:"井口一帯を指す雅名が、美濃の禅僧の著作に現れる。",zh:"指稱井口一帶的雅稱，出現在美濃禪僧的著作中。"} },
          { year:"1567", era:{en:"Eiroku 10",ja:"永禄10年",zh:"永祿10年"}, title:{en:"Nobunaga takes Inabayama",ja:"信長、稲葉山城を取る",zh:"信長奪取稻葉山城"},
            text:{en:"Inokuchi becomes Gifu; the tenka fubu seal comes into use.",ja:"井口が岐阜となり、「天下布武」の印が使われ始める。",zh:"井口改名岐阜，「天下布武」印開始使用。"} },
          { year:"1871", era:{en:"Meiji 4",ja:"明治4年",zh:"明治4年"}, title:{en:"Gifu Prefecture formed",ja:"岐阜県の成立",zh:"岐阜縣成立"},
            text:{en:"On 22 November (lunar calendar) the prefectures created from the Mino domains are merged into one, named after its seat.",ja:"11月22日（旧暦）、美濃の諸藩から生まれた県が統合され、県庁所在地の名をとって岐阜県となる。",zh:"11 月 22 日（舊曆），由美濃諸藩改設的各縣合併為一，以縣廳所在地為名，稱岐阜縣。"} },
          { year:"1876", era:{en:"Meiji 9",ja:"明治9年",zh:"明治9年"}, title:{en:"Hida joins",ja:"飛騨の編入",zh:"飛驒併入"},
            text:{en:"On 21 August the three Hida districts of the abolished Chikuma Prefecture — Ōno, Yoshiki and Masuda — are transferred to Gifu.",ja:"8月21日、廃止された筑摩県から飛騨の三郡（大野・吉城・益田）が岐阜県に移る。",zh:"8 月 21 日，已廢止的筑摩縣所轄飛驒三郡（大野、吉城、益田）移入岐阜縣。"} },
          { year:"1889", era:{en:"Meiji 22",ja:"明治22年",zh:"明治22年"}, title:{en:"Gifu becomes a city",ja:"岐阜市の誕生",zh:"岐阜市誕生"},
            text:{en:"Under the new municipal system the town of Gifu becomes one of the first cities in Japan.",ja:"市制の施行により、岐阜町は日本で最初期の市の一つとなる。",zh:"隨市制施行，岐阜町成為日本最早設立的市之一。"} }
